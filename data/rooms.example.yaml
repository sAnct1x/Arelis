# Copy to rooms.yaml to hand-write rooms, or just ask:
#   "make me a survey room that works in my Lab Notes folder"
#
# The room id `physics` is reserved. It is the spatial stage (World plate,
# C920 hands). Pose updates the scene without a chat turn. Do not reuse
# this id as a spreadsheet room.
#
# A room is a named place to work on one thing. It keeps its own conversation
# thread, points at one workspace project, and hands Arelis its purpose at the
# start of every turn inside it.
#
#   /rooms                  what exists
#   /room physics           go in  (or say "let's work on physics")
#   /leave                  come back out
#
# kind: analysis | code | general | research | writing
#   Sets which model she reaches for first and which skills she leans on. It is
#   a lean, not a limit — every tool still works in every room.
#
# tools: optional, and usually leave it out. Listing tool names locks the room
#   to exactly those, which is occasionally what you want and more often means
#   she has to refuse an ordinary question you happened to ask in here.

rooms:
  physics:
    name: Physics
    purpose: >-
      Spatial stage. This room is the only place hands and voice may drive
      a live simulation. Pose updates the scene without waiting on a turn.
      Forces and periods come from the engine; you do not invent them. Leave
      ends the motion grant. Record takes in this project's folder, not in orbit.
    root: Lab Notes
    kind: analysis

  arelis:
    name: Arelis
    purpose: >-
      Building Arelis herself. Read the code before proposing a change, keep
      diffs small, and run the tests.
    root: Arelis
    kind: code
