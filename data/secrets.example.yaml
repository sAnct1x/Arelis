# Copy this file to data/secrets.yaml and fill it in.
#
#     Copy-Item data\secrets.example.yaml data\secrets.yaml
#
# data/secrets.yaml is gitignored. Nothing in it is ever committed, and tool
# output is run through the secret redactor before it reaches the model.
#
# Until this exists, the email tools are simply not registered: Arelis will say
# she cannot send mail rather than trying and failing every time. The two blocks
# below are independent: email works without sms, and sms works without email.

email:
  # The Gmail account she sends from and reads. One account does both.
  address: ""

  # NOT your Google password -- Google stopped accepting those in 2022. This is
  # a 16-character app password from Google Account > Security > App passwords,
  # which requires 2-Step Verification on the account first.
  #
  # Paste it exactly as Google shows it; the spaces are display only and get
  # stripped. Setting ARELIS_EMAIL_PASSWORD in the environment overrides this,
  # if you would rather the secret did not sit on disk at all.
  app_password: ""

  # Where "email me" and scheduled digests go: YOUR inbox, not the address
  # she sends from. If this is blank and profile.yaml has no user.email, she
  # will ask rather than mailing her own Gmail.
  default_recipient: ""

sms:
  # Pair the Arelis Android companion (Settings → Notify on the PC, scan the
  # QR). That writes sms.companion for you. SMSGate credentials below remain
  # an escape hatch if the companion is not paired yet.
  #
  #   Companion: one APK, Local Server shape at http://PHONE:8080/messages
  #   SMSGate leftover: https://sms-gate.app Local or Cloud, as before
  #
  # Do not invent the path. Arelis appends /messages. Setting
  # ARELIS_SMSGATE_PASSWORD in the environment overrides password.
  #
  # Inbound (RCS / Google Messages): the companion POSTs to this PC. Set
  # ingest_token (or ARELIS_INGEST_TOKEN). Scan the QR rather than typing
  # http://THIS_PC_LAN_IP:8765. See docs/notify-inbound.md.
  #
  # Optional SMS/MMS leftover: Local Server inbox_base_url (GET /inbox). Does
  # not see RCS.
  base_url: ""
  username: ""
  password: ""
  # Shared secret for the companion (any long random string). Required to pair.
  ingest_token: ""
  # Optional. Leave 0 (or omit) to use the default SIM.
  # sim_number: 0
  # inbox_base_url: "http://PHONE_LAN_IP:8080"
  # inbox_username: ""
  # inbox_password: ""
  # Written by pairing. Do not invent:
  # companion:
  #   base_url: "http://PHONE_LAN_IP:8080"
  #   device_key: ""

# Optional. Google Calendar + Outlook via official APIs (explicit exception to
# local-first: calendar only; every write still needs an Allow card).
# Setup walkthrough: docs/calendar-oauth.md
#
# After client ids are pasted, run once:
#   arelis --auth-calendar google
#   arelis --auth-calendar outlook
# Those commands open a browser and write refresh_token back into this file.
calendar:
  # Optional private ICS feed (Google "secret address", Fastmail, etc.).
  # agenda(action=sync, provider=ics) downloads this into tools.briefing.calendar_path
  # after Allow. No OAuth. Paste the https URL only. Leave blank to skip.
  # ics_url: "https://example.com/private/calendar.ics"
  google:
    # Desktop OAuth client from Google Cloud Console (Calendar API enabled).
    client_id: ""
    client_secret: ""
    # Filled by `arelis --auth-calendar google`. Do not invent.
    refresh_token: ""
    # Optional override; default is primary.
    # calendar_id: "primary"
  outlook:
    # Azure app registration (personal Microsoft accounts or org+personal).
    # Public client (PKCE) preferred. Leave client_secret empty when possible.
    client_id: ""
    client_secret: ""
    # Usually "consumers" for personal Outlook.com; "common" if work+personal.
    tenant: "consumers"
    # Filled by `arelis --auth-calendar outlook`.
    refresh_token: ""
    # Optional Graph calendar id; empty = default calendar.

# Optional science catalogs. arXiv and JPL Horizons work with no key.
# APOD and NASA ADS stay quiet until you paste a free key. Do not put
# DEMO_KEY here. That is NASA's shared demo, not yours.
#
#   nasa.api_key  free at api.nasa.gov (no credit card)
#   ads.token     free NASA ADS account token
# Environment overrides: ARELIS_NASA_API_KEY, ARELIS_ADS_TOKEN.
nasa:
  api_key: ""
ads:
  token: ""

# Optional Earth-zone live AIS. Free key at https://aisstream.io
# Terrestrial receivers only. Mid-ocean stays empty (VHF); we do not buy
# satellite AIS. Finnish/Baltic AIS also comes from Fintraffic Digitraffic
# with no key.
# Environment override: ARELIS_AISSTREAM_KEY
earth:
  aisstream_key: ""
  # NASA FIRMS MAP_KEY (free at https://firms.modaps.eosdis.nasa.gov/api/)
  # Environment override: ARELIS_FIRMS_KEY
  firms_key: ""
  # aprs.fi API key — My account on https://aprs.fi (not this doc page).
  # Environment override: ARELIS_APRS_KEY
  # Terms: credit aprs.fi, User-Agent identifies Arelis, fetch only on Live.
  aprs_key: ""
  # Extra callsigns to query (max 20 with W1AW). API is name lookup, not a map.
  # aprs_calls:
  #   - W1AW
  # Shodan banner catalog. Banners, not a login.
  # Environment override: ARELIS_SHODAN_KEY
  shodan_key: ""
  # Kystverket / BarentsWatch AIS. Free AIS client at https://www.barentswatch.no
  # MyPage → register an AIS client. Norwegian EEZ including their satellites.
  # Environment: ARELIS_BARENTSWATCH_CLIENT_ID / ARELIS_BARENTSWATCH_CLIENT_SECRET
  barentswatch_client_id: ""
  barentswatch_client_secret: ""
  # Global Fishing Watch token (free account). CC BY-NC. Local observer only.
  # Unmatched SAR onto radar. Not hull names. Environment: ARELIS_GFW_TOKEN
  gfw_token: ""
  # Local webcam (any device index). WGS84 required to plot face boxes on the globe.
  # local_camera:
  #   device: 0
  #   lat:
  #   lon:
  #   heading_deg: 0
  # Owned camera *positions*. Optional rtsp: for a stream you own. Never logged.
  # cameras:
  #   - id: driveway
  #     lat:   # WGS84 of a camera you own
  #     lon:
  #     heading_deg: 0
  #     rtsp: rtsp://user:pass@192.168.1.20/stream
