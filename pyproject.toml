[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "arelis-sentinel"
version = "0.1.0"
description = "Autonomous narrow-caste Sentinel swarm engine, perimeter defense wall, research harvester, and 60 FPS 3D Overseer for Arelis."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "AGPL-3.0-or-later" }
dependencies = [
    "httpx>=0.27.0",
    "psutil>=5.9.0",
    "PyYAML>=6.0.1",
]

[project.optional-dependencies]
ui = [
    "PySide6>=6.6.0",
]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "ruff>=0.4.0",
    "mypy>=1.10.0",
]

[project.scripts]
sentinel = "sentinel.__main__:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["sentinel*"]

[tool.setuptools.package-data]
sentinel = ["ui/overseer/*", "ui/overseer/**/*", "config/*.yaml"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true

