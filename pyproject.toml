[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "arelis"
# Read from arelis/__init__.py rather than repeated here. Two copies of a
# version number stay equal only while somebody remembers, and the one a user
# is shown should be the one the package actually is.
dynamic = ["version"]
description = "Arelis — local-first personal research assistant (ah-REL-is)"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "AGPL-3.0-or-later" }
authors = [{ name = "sAnct1x" }]
classifiers = [
  "License :: OSI Approved :: GNU Affero General Public License v3 or later (AGPLv3+)",
  "Environment :: X11 Applications :: Qt",
  "Intended Audience :: End Users/Desktop",
  "Operating System :: Microsoft :: Windows :: Windows 10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Topic :: Utilities",
]
dependencies = [
  "httpx>=0.27",
  "cryptography>=43.0",
  # Version comparison for the self-updater, which has to know that 0.10.0 is newer than
  # 0.9.0. Already present as somebody else's transitive dependency; named here because
  # arelis.update imports it directly, and depending on a package you did not ask for
  # works right up until the package that dragged it in drops it.
  "packaging>=23.0",
  "beautifulsoup4>=4.12",
  "lxml>=5.0",
  "pandas>=2.2",
  "numpy>=1.26",
  "PySide6>=6.6",
  "PyYAML>=6.0",
  "pypdf>=5.0",
  # Deterministic algebra and units so a 9B does not recite integrals or CODATA.
  # BSD; core rather than an extra — science on this PC is the product, not a niche.
  "sympy>=1.13",
  "Pint>=0.24",
  # Charts from tables. PSF license (BSD-compatible). Core, not an extra: a
  # stranger's pip install -e . should plot a CSV without knowing a extra name.
  "matplotlib>=3.8",
  # Documents the user can double-click: PDF, Word, Excel. Core, not an extra —
  # "make me a pdf" is the ask, not a niche.
  "fpdf2>=2.8",
  "python-docx>=1.1",
  "openpyxl>=3.1",
  # Pixel work with an exactly right answer: resizing and colour adjustment for
  # the image_edit tool, and downscaling a screenshot so it fits in the vision
  # model's context at all. A core dependency rather than an extra because
  # without it a pasted screenshot cannot be looked at, which is not a niche.
  "Pillow>=10.0",
  # Pairing QR on Settings → Notify. Local; no network. BSD.
  "segno>=1.6",
  "google-auth>=2.0",
  "google-auth-oauthlib>=1.2",
  "msal>=1.28",
]

[project.optional-dependencies]
# Speech recognition + Kokoro G2P. Capture and playback use QtMultimedia
# (inside PySide6): no second audio stack. Piper remains a separate
# `pip install piper-tts` (GPL, fallback). Kokoro weights download into
# models/kokoro/ on first speak when voice.tts.allow_download is true.
# Sherpa-ONNX is the dictate/conversation ear; faster-whisper stays as
# fallback and for wake until a free ONNX wake model exists.
voice = [
  "faster-whisper>=1.0",
  "sherpa-onnx>=1.10",
  "onnxruntime>=1.16",
  "espeakng-loader>=0.2.4",
  "phonemizer-fork>=3.3.2",
]
# Its own extra rather than part of `voice`, because it is the one voice component
# you cannot use by installing it. openwakeword detects a wake word from a model you
# train yourself; there is no hey_arelis.onnx in this repository and no free one to
# download, so installing the package buys a code path that raises WakeUnavailable.
# It is also the most expensive thing in the tree by a wide margin -- it pulls scipy,
# scikit-learn and their shared libraries, around 175MB, for an engine that is not
# the one wake currently runs on. arelis/voice/openwake.py imports it inside the
# function that needs it and reports its absence, so this staying uninstalled costs
# nothing but that engine.
openwakeword = [
  "openwakeword>=0.6.0",
]
browser = [
  "playwright>=1.40",
]
# Physics-room hand tracking. Optional: the rest of Arelis does not import
# this at startup. pip install -e ".[spatial]" on the checkout that tests it.
spatial = [
  "mediapipe>=0.10.9",
]
# Solar-system N-body (REBOUND, GPL-3). Source checkout only. Never add this
# extra to `installer` — the World stage is gated off packaged copies.
astro = [
  "rebound>=4.0",
  "sgp4>=2.23",
]
# The feature set the Windows installer ships, named here so that it is declared in
# one place rather than copied into a build script. packaging/lock.py resolves this
# and nothing else, so a dependency added to `voice` reaches the installer by being
# added to `voice`, and the only way to ship something is to say so here.
installer = [
  "arelis[voice]",
  "arelis[browser]",
]
dev = [
  # Exact, not a floor. A range meant CI installed whatever ruff shipped that
  # morning, and every release that adds a rule turns an untouched tree red —
  # which is how this repo ended up with 24 lint errors nobody wrote. New rules
  # are worth taking, but as a deliberate version bump, not as a surprise on
  # somebody's unrelated pull request.
  "ruff==0.16.1",
  "pytest>=8.0",
  "pytest-asyncio>=0.23",
  # Hung Qt tests used to sit until GitHub's six-hour job wall. A per-test
  # ceiling fails the test instead. Pin a floor, not a star: a new timeout
  # plugin is not a new lint rule.
  "pytest-timeout>=2.3",
]

[project.scripts]
arelis = "arelis.main:main"
arelis-relay = "arelis.relay.__main__:main"

# The same entry point behind a launcher that starts without a console, for anyone who
# pip-installs Arelis and wants to double-click something. `arelis.exe` keeps its console
# because --version, --cli and --help are meant to print somewhere a person can read;
# double-clicking that one would flash a black window and leave it open behind the UI.
# configure_logging declines to attach a console handler when stderr is not a tty, so the
# windowless one is not quietly throwing its own diagnostics away.
#
# The Windows installer does not ship either of these. pip writes the absolute path of the
# installing interpreter into the launcher it generates, which is correct in a virtualenv
# that stays put and wrong in a tree built on one machine to run on another, so build.py
# deletes them and points every shortcut at {app}\pythonw.exe -m arelis instead.
[project.gui-scripts]
arelisw = "arelis.main:main"

[tool.setuptools.dynamic]
version = { attr = "arelis.__version__" }

[tool.setuptools.packages.find]
where = ["."]
include = ["arelis*"]

[tool.setuptools.package-data]
# Anything here that is not a .py file has to be listed, or it is simply absent
# from an install. The window, tray and taskbar icon was missing from this list
# and also lived outside the package, so an installed Arelis had no icon at all
# while a checkout looked perfect. tests/test_packaged_assets.py now fails when a
# non-Python file in the package is not covered by one of these globs.
arelis = ["persona/*.md", "config/*.yaml", "ui/fonts/*", "assets/*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
# Seconds. A solar-panel test that deadlocks the offscreen Qt event loop used
# to hold a CI runner until the job timed out at six hours. 90s is far above
# any honest test in this tree (the whole suite is ~2 minutes locally).
timeout = 90
timeout_method = "thread"

# Pinned so `ruff check .` gives the same answer on every machine. Without a
# section here ruff falls back to whatever its current defaults are, which
# drift between releases and made local and CI runs disagree.
[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "ASYNC", "RUF"]
ignore = [
  # Qt requires camelCase for the methods it calls back into (paintEvent,
  # eventFilter, closeEvent). Renaming them would silently stop them running.
  "N802",
  # Qt nativeEvent(eventType, message) — rename breaks the override match.
  "N803",
  # Deliberate at tool and provider boundaries: a failure there is reported as
  # a ToolResult or an ERROR event, never raised into the agent loop.
  "B904",
  # Tool classes declare parameters_schema as a class attribute on purpose.
  # It is a constant read by the registry, never mutated per instance.
  "RUF012",
  # EventType stays (str, Enum). Switching to StrEnum changes what str() and
  # f-strings produce, and the value is already read explicitly via .value.
  "UP042",
  # No trio/anyio Path in this tree; Path.exists/mkdir here are sync metadata.
  "ASYNC240",
  # Physics, HUD copy, and this project's prose use ×, Unicode minus, and
  # en-dashes on purpose. These three rules treat them as typos for x / hyphen,
  # which is how every solar-lab commit turned eight CI jobs red. Homoglyphs
  # in identifiers are a different problem; these rules do not catch that.
  "RUF001",
  "RUF002",
  "RUF003",
]

[tool.ruff.lint.per-file-ignores]
# Tests name the defect they pin, which runs longer than a code identifier.
"tests/*" = ["E501"]
# The e2e scripts run standalone and must extend sys.path before importing
# arelis, so their imports cannot all sit at the top of the file. Case lambdas
# also run long on purpose (tool name + assistant snippet checks).
"scripts/*" = ["E402", "E501"]
# IAU / dipole / body-frame sketches use L, R, Rp as the paper does. Renaming
# them to satisfy N806 would make the code disagree with every citation.
"arelis/physics/**" = ["N806"]
