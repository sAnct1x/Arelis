name: Tool choice

# Nightly score of the shipping tool-choice arm (skinny schema + preflight)
# against tests.eval_floors.CHOICE_LIVE_FLOOR. The script exits 0 when Ollama
# is unreachable — GitHub-hosted runners will not have the daemon — unless
# ARELIS_REQUIRE_LIVE=1, which is the flag for a desk that is supposed to
# have the model.

on:
  schedule:
    # Daily, 08:00 UTC — after the Monday guard-coverage job at 07:00.
    - cron: "0 8 * * *"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: true

jobs:
  choice-board:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      - name: Install Qt offscreen libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y libegl1 libxkbcommon-x11-0 libdbus-1-3

      - name: Install package
        run: python -m pip install -e ".[dev]"

      - name: Score the shipping arm
        run: |
          set -o pipefail
          python scripts/run_choice_board.py --json choice-board.json | tee choice-board.txt

      - name: Upload the report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: choice-board
          path: |
            choice-board.json
            choice-board.txt
          if-no-files-found: ignore
