name: Guard coverage

# Mutation testing over the compensation layer: switch each guard rail off, run
# the scripted board, and report any guard you can disable with the board still
# green. Those are the tests that cannot fail, and a suite of them is worse
# than no suite — it is a green light over an untested product.
#
# On 2026-08-14 twelve of nineteen guard rails were holes and nobody knew,
# because the board was not run and 35 of its 68 scenarios handed the loop the
# call they then asserted. As of 2026-09-17 it reports 16 covered, 0 holes and
# 3 blind spots it names and justifies.
#
# Weekly rather than per-push: it runs the whole board twenty times (about 70
# seconds locally, longer on a runner) and the thing it guards against is slow
# rot, not a bad commit. The eval job in ci.yml is the per-push gate.

on:
  schedule:
    # Mondays, 07:00 UTC — a result waiting at the start of the week.
    - cron: "0 7 * * 1"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: true

jobs:
  mutate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Qt offscreen libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y libegl1 libxkbcommon-x11-0 libdbus-1-3

      - name: Install package
        run: python -m pip install -e ".[dev]"

      # Exits non-zero on a hole. A blind spot with a written reason does not
      # count — see the `blind_spot` field in the script for why that exemption
      # is narrow on purpose.
      - name: Mutate the guard rails
        run: python scripts/mutate_guards.py | tee guard-coverage.txt

      - name: Upload the report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: guard-coverage
          path: guard-coverage.txt
          if-no-files-found: ignore
