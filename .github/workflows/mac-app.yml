name: Mac app

# Unsigned Arelis.app in a disk image. Not on every push: it downloads the
# interpreter and the locked wheels. A pull request that touches the Mac
# build, this workflow, or the updater runs it so the change proves itself.
on:
  workflow_dispatch:
  push:
    # Tags always build. Path filters are not applied to tag pushes.
    # Branch pushes build only when the Mac app or the updater changes,
    # so this branch can prove the disk image before a pull request exists.
    tags: ["v*"]
    paths:
      - "mac-installer/**"
      - ".github/workflows/mac-app.yml"
      - "arelis/update.py"
  pull_request:
    paths:
      - "mac-installer/**"
      - ".github/workflows/mac-app.yml"
      - "arelis/update.py"

permissions:
  contents: read

jobs:
  app:
    runs-on: macos-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # The interpreter that runs the build, not the one that gets shipped.
      # build.py downloads CPython 3.13.16 from python-build-standalone and
      # checks the pinned digest.
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14"

      - name: Check the lock is still pinned
        run: python mac-installer/lock.py --check

      - name: Build the app
        run: python mac-installer/build.py

      - name: Launch check
        run: python mac-installer/launch_check.py

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: arelis-mac-dmg
          path: mac-installer/dist/*.dmg
          if-no-files-found: error
          retention-days: 14
