name: Nightly live pass

# live_feature_pass.py walks registered tools against a real Ollama.
# GitHub-hosted runners will not have the daemon, so a skip is success
# unless ARELIS_REQUIRE_LIVE=1 (desk nightly that is supposed to have
# the model). Same flag as tool-choice.yml.

on:
  schedule:
    - cron: "0 9 * * *"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: true

jobs:
  live-pass:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"

      - name: Install Qt offscreen libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y libegl1 libxkbcommon-x11-0 libdbus-1-3

      - name: Install package
        run: python -m pip install -e ".[dev]"

      - name: Live feature pass
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          set -o pipefail
          if python -c "from arelis.setup.engine import ollama_reachable; raise SystemExit(0 if ollama_reachable() else 1)"; then
            python scripts/live_feature_pass.py 2>&1 | tee live-feature-pass.txt
          else
            echo "SKIP: Ollama not reachable"
            if [ "${ARELIS_REQUIRE_LIVE:-}" = "1" ]; then
              exit 1
            fi
            echo "SKIP: Ollama not reachable" > live-feature-pass.txt
          fi

      - name: Upload the report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: live-feature-pass
          path: |
            live-feature-pass.txt
            outputs/live_pass/
          if-no-files-found: ignore
