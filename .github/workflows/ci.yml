name: CI

on:
  push:
  pull_request:

# One push, one run. A second commit used to leave the previous 17-job matrix
# running (once to the six-hour wall) while eight identical ruff failures
# emailed again. Cancel the leftover.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Ruff used to sit inside the 8-way test matrix. One unsorted import then
  # failed eight jobs, pytest never ran, and the inbox saw eight mails. This
  # job is the only place ruff runs. The matrices wait on it.
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      # Ruff only. The pin lives in pyproject.toml; tests/test_ci_gate.py
      # fails if this line and that pin disagree.
      - name: Install ruff
        run: python -m pip install "ruff==0.16.1"
      - name: Ruff
        run: python -m ruff check .

  # 3.11 is the floor requires-python claims, so it is tested to keep the claim
  # honest. 3.14 is the interpreter the Windows installer ships, so a failure there
  # is a failure in the artefact people are handed rather than in a version somebody
  # might happen to have; it is not optional and must not be dropped to save minutes.
  test:
    needs: lint
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
        python-version: ["3.11", "3.12", "3.13", "3.14"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      # Offscreen Qt needs a handful of shared libraries that the runner image
      # does not ship. tests/conftest.py already forces QT_QPA_PLATFORM=offscreen;
      # without these the import of PySide6 aborts the process before pytest runs.
      - name: Install Qt offscreen libraries
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libegl1 libxkbcommon-x11-0 libdbus-1-3

      - name: Install package
        run: python -m pip install -e ".[dev]"

      - name: Pytest
        run: python -m pytest -q --tb=short --junitxml=pytest-results.xml

      # One file instead of eight identical "exit code 1" mails with no body.
      - name: Upload pytest results
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: pytest-${{ matrix.os }}-${{ matrix.python-version }}
          path: pytest-results.xml
          if-no-files-found: ignore

      # Unit tests can prove the XML says the right thing; only Windows can prove
      # Task Scheduler accepts it. Registers a harmless smoke task and deletes it.
      - name: Task Scheduler smoke
        if: runner.os == 'Windows'
        run: python scripts/schtasks_smoke.py

  # Adding a dependency and forgetting to regenerate the lock would ship an installer
  # missing it, and nothing else in this file would notice: the jobs above install from
  # pyproject, which is exactly the file that was updated. Offline and a few seconds,
  # and deliberately not a re-resolution -- a check that compared the lock against a
  # fresh resolve would go red whenever any of 76 upstream projects published anything.
  lock:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - name: Lock is complete, pinned and hashed
        run: python win-installer/lock.py --check

  # The job above installs with -e, which makes the directory above the package the
  # repository. So is_source_checkout() is true in every leg, and every rule that
  # only differs once installed has never run anywhere. That is not theoretical: the
  # window icon shipped nowhere at all for months, and a directory was created inside
  # the package on every launch, and a checkout showed neither.
  #
  # This installs the built wheel into a clean environment and runs from a directory
  # that is not the repository, which is the only arrangement in which those two
  # defects are visible.
  installed:
    needs: lint
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
        python-version: ["3.11", "3.12", "3.13", "3.14"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      # installed_smoke.py imports arelis.ui.theme, because the font directory is one
      # of the two things that used to be written inside the package.
      - name: Install Qt offscreen libraries
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libegl1 libxkbcommon-x11-0 libdbus-1-3

      - name: Build the wheel
        run: python -m pip wheel --no-deps --wheel-dir dist .

      # A fresh environment rather than the one the wheel was built in, so nothing
      # already imported can stand in for something the wheel forgot to ship.
      - name: Install the wheel into a clean environment
        shell: bash
        run: |
          python -m venv "$RUNNER_TEMP/probe"
          if [ "$RUNNER_OS" = "Windows" ]; then
            echo "PROBE=$RUNNER_TEMP/probe/Scripts/python.exe" >> "$GITHUB_ENV"
          else
            echo "PROBE=$RUNNER_TEMP/probe/bin/python" >> "$GITHUB_ENV"
          fi

      - name: Installed-copy checks
        shell: bash
        # Not the repository. From inside it, `import arelis` finds the source tree
        # and every check passes while proving nothing — which the script's first
        # check refuses, but running from the right place is cheaper than relying on
        # being caught.
        working-directory: ${{ runner.temp }}
        run: |
          "$PROBE" -m pip install "$GITHUB_WORKSPACE"/dist/arelis-*.whl
          "$PROBE" "$GITHUB_WORKSPACE/scripts/installed_smoke.py"
