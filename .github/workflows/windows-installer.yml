name: Windows installer

# Separate from ci.yml, and not on every push. This downloads about a gigabyte of wheels
# and spends minutes compressing 640MB with solid LZMA2, which is not a reasonable thing
# to do on a commit that edited a docstring.
#
# The reason to build releases here rather than only on a developer's machine is that
# "the build that was tested" has to mean something. This runs from a clean checkout on a
# clean runner, against the pinned and hashed lock, so the artefact is a function of the
# tag rather than of what happened to be installed somewhere.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  companion-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    defaults:
      run:
        working-directory: android/arelis-notify
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"
      - name: Make gradlew executable
        run: chmod +x gradlew
      - name: Gradle version from wrapper properties
        id: props
        run: |
          ver=$(sed -n 's|.*gradle-\([0-9][0-9.]*\)-.*|\1|p' gradle/wrapper/gradle-wrapper.properties)
          echo "version=$ver" >> "$GITHUB_OUTPUT"
          if [ -f gradle/wrapper/gradle-wrapper.jar ]; then
            echo "mode=wrapper" >> "$GITHUB_OUTPUT"
          else
            echo "mode=direct" >> "$GITHUB_OUTPUT"
          fi
      - name: Setup Gradle (wrapper)
        if: steps.props.outputs.mode == 'wrapper'
        uses: gradle/actions/setup-gradle@v6
      - name: Setup Gradle (no wrapper jar)
        if: steps.props.outputs.mode == 'direct'
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: ${{ steps.props.outputs.version }}
      - name: Write release keystore
        env:
          ARELIS_ANDROID_KEYSTORE_BASE64: ${{ secrets.ARELIS_ANDROID_KEYSTORE_BASE64 }}
          ARELIS_ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ARELIS_ANDROID_KEYSTORE_PASSWORD }}
          ARELIS_ANDROID_KEY_ALIAS: ${{ secrets.ARELIS_ANDROID_KEY_ALIAS }}
          ARELIS_ANDROID_KEY_PASSWORD: ${{ secrets.ARELIS_ANDROID_KEY_PASSWORD }}
        run: |
          if [ -z "${ARELIS_ANDROID_KEYSTORE_BASE64:-}" ]; then
            echo "No keystore; debug build"
            exit 0
          fi
          mkdir -p "$HOME/arelis-android"
          printf '%s' "$ARELIS_ANDROID_KEYSTORE_BASE64" | base64 -d > "$HOME/arelis-android/release.jks"
          echo "ARELIS_ANDROID_KEYSTORE=$HOME/arelis-android/release.jks" >> "$GITHUB_ENV"
          echo "ARELIS_ANDROID_KEYSTORE_PASSWORD=${ARELIS_ANDROID_KEYSTORE_PASSWORD}" >> "$GITHUB_ENV"
          echo "ARELIS_ANDROID_KEY_ALIAS=${ARELIS_ANDROID_KEY_ALIAS}" >> "$GITHUB_ENV"
          echo "ARELIS_ANDROID_KEY_PASSWORD=${ARELIS_ANDROID_KEY_PASSWORD}" >> "$GITHUB_ENV"
      - name: Assemble and stage
        working-directory: .
        run: python3 scripts/build_companion.py
      - uses: actions/upload-artifact@v7
        with:
          name: arelis-companion-apk
          path: |
            companion/arelis.apk
            companion/arelis.apk.json
          if-no-files-found: error
          retention-days: 30

  installer:
    needs: companion-apk
    runs-on: windows-latest
    timeout-minutes: 60
    permissions:
      # Only for the release step at the end, and only on a tag.
      contents: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          name: arelis-companion-apk
          path: companion

      # The interpreter that runs the build, not the one that gets shipped. build.py
      # downloads CPython 3.14.7's embeddable distribution itself and verifies it against
      # the digest python.org publishes. Matching versions anyway, so that the pip doing
      # the resolving agrees with the interpreter being resolved for.
      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: win-installer/requirements-win-amd64-cp314.txt

      # Chocolatey rather than winget: it is preinstalled on these runners and behaves
      # predictably without a console attached, which winget does not always.
      - name: Install Inno Setup
        run: choco install innosetup -y --no-progress

      - name: Build the installer
        run: python win-installer/build.py

      # Nothing here is code-signed, so the digest is what a cautious person actually
      # has to check against. Written beside the installer and shown in the run summary,
      # because a hash nobody can find is a hash nobody checks.
      - name: Record the digest
        shell: pwsh
        run: |
          $exe = Get-ChildItem win-installer/dist/*-setup.exe | Select-Object -First 1
          $hash = (Get-FileHash $exe.FullName -Algorithm SHA256).Hash.ToLower()
          "$hash  $($exe.Name)" | Out-File -Encoding ascii "$($exe.FullName).sha256"
          @(
            "### $($exe.Name)",
            "",
            "| | |",
            "|---|---|",
            "| Size | $([math]::Round($exe.Length / 1MB, 1)) MB |",
            "| SHA-256 | ``$hash`` |",
            "",
            "Not code-signed. SmartScreen will warn on first download.",
            "Verify with ``Get-FileHash <file> -Algorithm SHA256``."
          ) | Out-File -Append -Encoding utf8 $env:GITHUB_STEP_SUMMARY

      - uses: actions/upload-artifact@v7
        with:
          name: arelis-windows-installer
          path: |
            win-installer/dist/*-setup.exe
            win-installer/dist/*-setup.exe.sha256
          if-no-files-found: error
          retention-days: 30

      # gh is preinstalled on the runners, so no third-party action is needed to publish.
      # A draft, deliberately: the notes are worth writing by hand, and an unsigned
      # installer going public should be a decision somebody makes rather than something
      # a tag does.
      - name: Attach to a draft release
        if: startsWith(github.ref, 'refs/tags/')
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = "${{ github.ref_name }}"
          if (-not (gh release view $tag 2>$null)) {
            gh release create $tag --draft --title "Arelis $tag" --notes "Draft. Unsigned installer; the .sha256 beside it is what to verify against."
          }
          gh release upload $tag (Get-ChildItem win-installer/dist/*-setup.exe*) --clobber
