version: 2
updates:
  - package-ecosystem: "pip"
    directory: "/"
    schedule:
      interval: "monthly"
    open-pull-requests-limit: 5
    commit-message:
      prefix: "deps"
    # Only update direct dependencies declared in pyproject.toml.
    # Do not touch generated lockfiles like win-installer/requirements-win-amd64-cp314.txt,
    # which must be regenerated by running win-installer/lock.py.
    allow:
      - dependency-type: "direct"
    groups:
      pip-dependencies:
        patterns:
          - "*"

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "monthly"
    open-pull-requests-limit: 5
    commit-message:
      prefix: "deps"
    groups:
      github-actions:
        patterns:
          - "*"
