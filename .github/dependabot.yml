version: 2
updates:
  - package-ecosystem: "pip"
    directory: "/"
    schedule:
      interval: "monthly"
    open-pull-requests-limit: 5
    commit-message:
      prefix: "deps"
    groups:
      pip-dependencies:
        patterns:
          - "*"

  - package-ecosystem: "pip"
    directory: "/win-installer"
    schedule:
      interval: "monthly"
    open-pull-requests-limit: 5
    commit-message:
      prefix: "deps"
    groups:
      pip-dependencies:
        patterns:
          - "*"
    ignore:
      - dependency-name: "PySide6*"
        versions: [">= 6.12"]
      - dependency-name: "shiboken6"
        versions: [">= 6.12"]

  - package-ecosystem: "pip"
    directory: "/mac-installer"
    schedule:
      interval: "monthly"
    open-pull-requests-limit: 5
    commit-message:
      prefix: "deps"
    groups:
      pip-dependencies:
        patterns:
          - "*"
    ignore:
      - dependency-name: "PySide6*"
        versions: [">= 6.12"]
      - dependency-name: "shiboken6"
        versions: [">= 6.12"]

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "monthly"
    open-pull-requests-limit: 5
    commit-message:
      prefix: "deps"
    groups:
      github-actions:
        patterns:
          - "*"
