ollama:
  base_url: "http://127.0.0.1:11434"
  timeout_s: 300
  # Context window sent with every request. Ollama's own default is small
  # (2048 tokens on most builds), and anything past it is dropped from the
  # front of the prompt without warning.
  #
  # This number used to be an estimate that kept getting argued with. It is now
  # measured: scripts/measure_context_ceiling.py loads the model at a candidate
  # window and compares /api/ps size_vram against size, because a model that
  # does not fit wholly in VRAM has spilled layers to the CPU and costs far more
  # than the window buys. On the reference card (RX 6700 XT, 12 GB) with
  # qwen3.5:9b:
  #
  #     num_ctx    VRAM      all on GPU   cold reply
  #      16384   5.62 GiB       yes          4.6 s
  #      32768   6.15 GiB       yes          4.6 s
  #      65536   7.21 GiB       yes          4.8 s
  #     131072   9.12 GiB       yes          4.9 s
  #
  # Latency is flat, so the old worry about warm prefill was never the real
  # constraint. 65536 is the default because it leaves ~4.8 GiB for the vision
  # model, Comfy, and the desktop; 131072 fits but leaves under 3 GiB.
  #
  # Setup overrides this per machine from measured VRAM — see
  # arelis/setup/context.py. Persona + telegraph policy + skinny schemas
  # stay under ~10k tokens (see tests/test_prompt_fits_window.py). A long
  # session no longer needs the history summariser to survive.
  num_ctx: 65536
  # Research is a deeper loop on the same weights, so it gets the same window.
  # It used to be 8192 — smaller than chat — which meant the role that reads the
  # most sources had the least room to keep them.
  research_num_ctx: 65536
  # Fallback VL one-shot for a chat model that cannot see (DeepSeek R1). A
  # multimodal chat model handles images itself and never reads this.
  vision_num_ctx: 4096

# Role → Ollama tag. First open recommends one chat model from hardware and
# pins both chips to that tag in config.local.yaml. These are the last-resort
# shipped names if setup has not run yet: the measured daily driver, one file.
# There is no code role: file/git/debug work uses fast plus workspace skills.
# See docs/models.md. One chat model hot at a time. Embeddings are a separate
# small model loaded briefly for recall/indexing, not mid-turn chat.
models:
  fast: "qwen3.5:9b"
  research: "qwen3.5:9b"
  # Fallback single-frame VL, pulled only when the chat model cannot see. Qwen
  # 3.5 and Gemma 4 take images directly, so on those this tag is never pulled
  # and never loaded. DeepSeek R1 is text-only and still needs it.
  vision: "qwen2.5vl:3b"

router:
  # Residency for a non-default role after a turn. "0" made every research
  # follow-up pay a cold load. "5m" keeps deep sessions warm.
  keep_alive: "5m"
  default_role: "fast"     # conversation role; stays pinned between turns
  # How long the default role stays in VRAM after a request / pin.
  # Longer = fewer cold TTFTs in a session. Use -1 to keep until Ollama exits.
  # Both chips are normally the same tag, so `/role research` changes the loop
  # rather than the weights and costs nothing. A VRAM miss ends the turn (no
  # JSON fallback — that used to start a second load and lock the PC).
  default_keep_alive: "30m"
  warm_on_start: true      # pin default model when UI/CLI starts (fail soft)
  rewarm_after_switch: true  # after a different tag, pin fast again (delayed)
  # Sticky hold + delayed re-pin of the default (same clock by default). While
  # the last heavier model is sticky, auto/fast turns stay on it instead of
  # unloading. An explicit chip still switches; `/role fast` clears sticky.
  # Speculative decoding is not available on Ollama+Windows+AMD.
  rewarm_delay_s: 60
  # sticky_hold_s: 60   # optional override; defaults to rewarm_delay_s

memory:
  # Semantic recall / doc index. Pulled: ollama pull nomic-embed-text
  # The indexer never runs mid-turn; a recall search may load it briefly.
  embed_model: "nomic-embed-text"
  docs:
    # Index readable files under workspace.roots into memory.db between turns.
    # recall(source=docs|all) can then find project notes, not only chat.
    enabled: true
    max_file_bytes: 524288
    chunk_chars: 1200
    chunk_overlap: 200
  mail:
    # Opt-in. When true, idle ticks peek a sliding window of recent mail into
    # memory.db (readonly IMAP + BODY.PEEK; never marks read). Off by default
    # so a large mailbox is not mirrored without asking.
    enabled: false
    max_messages: 40
    retention_days: 30
    max_body_chars: 4000
    # Minimum seconds between IMAP syncs while the UI is idle.
    min_interval_s: 900

agent:
  max_rounds: 8            # model/tool steps before Arelis is forced to answer
  tool_output_chars: 14000 # per tool result; keep below num_ctx (see above)
  confirm_writes: true     # file write/edit needs approval in the UI
  # Asked about every single send, and never covered by "rest of this ask".
  # Mail leaves the machine and cannot be recalled.
  confirm_send: true
  # Auto-deny cards left open (L10). 0 = wait forever.
  confirm_timeout_s: 300
  confirm_image: true      # image generation needs approval in the UI
  # Pause when she *offers* her window. A drive you already typed or said is
  # the grant. rest of this ask covers further steps. Never batches with mail/SMS.
  confirm_browser: true
  # See one local image (VL). Separate from confirm_image so disabling Comfy
  # generation confirm does not disable vision. rest of this ask covers it.
  confirm_vision: true
  # Run a project .py (run_script). Separate from file writes so trusting
  # notes does not auto-run programs. Filament still pauses on voice.
  confirm_run: true
  json_fallback: true      # allow the JSON tool protocol when native calling fails
  block_private_urls: true # refuse loopback, private, and link-local targets
  # Per-turn latency to logs/turns.log (and a one-line "timing …" in Thinking).
  # Leave on while tuning conversation speed; set false to silence the file.
  turn_telemetry: true
  # High-value bus events → logs/events.log (confirms, SMS, tools, errors).
  # Omits ASSISTANT_DELTA / audio. See docs/telemetry.md.
  event_telemetry: true
  # House watch: the doors Arelis opened (LAN ingest, outbound APIs). Not
  # antivirus and not a scan of the whole PC. STATUS lines start with "Watch:".
  watch:
    enabled: true
    inbound_burst: 40
    inbound_window_s: 10
    auth_fail_limit: 8
    auth_fail_window_s: 60
    auth_lock_s: 300
    max_body_bytes: 2097152
    egress_burst: 48
    egress_window_s: 10
    egress_daily: 8000
    per_host_burst: 24

  # Off: every turn sends the same tool schemas the startup prefix seed used.
  # On, a greeting skips schemas and blows that cache — the next real question
  # then prefills ~18k tokens again (~40s). That is the 50s TTFT after "hi".
  chat_fast_path: false
  # Tool-bearing model rounds: lower temperature to cut preamble decode bloat.
  tool_round_temperature: 0.1
  # Deterministic nudges for clear weather / SMS intents. Never skips Allow.
  intent_preflight: true
  # Inject short failure lessons (data/lessons.yaml + built-in seed).
  lessons: true
  # At UI/CLI start, mine logs/turns.log and append curated lessons by signature.
  # Fail soft; never invents free-form text (fixed catalog only).
  auto_lessons: true
  # If she searched for news/current events but never scraped, nudge once.
  scrape_after_search: true
  # If scrape or web_fetch hit a JavaScript shell, nudge once to open that URL
  # in her window. Allow still gates the first browser call. Never injects.
  browser_after_js_shell: true
  # Mid-turn: if a multi-step Plan ran early tools but skipped a later step,
  # nudge once (e.g. tasks→agenda). Does not call tools or skip Allow.
  plan_progress: true
  # If to+body are known but she never called send_sms, nudge once (Allow still).
  sms_force_call: true
  # When to+body are already known, raise the Allow card before the first model
  # round instead of after it. Tool rounds hold the answer back, so a spoken
  # "text my wife …" showed an empty thread until the 7B decided, which read as
  # hung and got Esc'd. Allow is still the only thing that sends.
  sms_preinject: true
  # Same for email when subject+body are known (Allow still).
  email_force_call: true
  # Calendar create draft known but she never called agenda (often chats steps
  # or falsely picks send_sms / web_search for "reminder to text …").
  agenda_force_call: true
  # Image-gen ask clear but she never called image (often picks web_search).
  image_force_call: true
  # A task/goal ask that produced no store call gets the call injected. These two
  # already reported themselves to telemetry as the tasks_force and goals_force
  # gates, next to five siblings that each had a switch, but they had none: they
  # were unconditional, so "measure the board with the store forcing off" was a
  # question the config could not express. Both default on, so nothing moves.
  tasks_force_call: true
  goals_force_call: true
  # The three below were read from config but never listed here, so they were on
  # and looked like they were not. Each is a real switch.
  #
  # A weather ask that produced no weather call gets one nudge, then a redirect
  # if she reaches for web_search/scrape/fetch instead.
  weather_force_call: true
  # An ask about an image she can see, where vision never ran: inject it against
  # the most recent generated image.
  vision_force_call: true
  # After a browser CDP failure, tell her once that "open" is a plain OS open and
  # relaunch is the Allow-gated one, so she does not retry the dead path.
  browser_relaunch_force: true
  # An argument the tool never declared is dropped in silence, because tools take
  # **kwargs and read only the keys they know. The reply is then built on a belief
  # the tool never honoured: weather(days=2, latitude=39.7) answers for the
  # profile location without mentioning the coordinate it ignored. Off, that call
  # runs and quietly returns the wrong place.
  strict_tool_args: true
  # Exactness: math must use calculator; contingent facts need an evidence
  # warrant from tools this turn. See docs/architecture.md.
  exactness: true
  numeric_gate: true
  evidence_gate: true
  # Research role: prefer two independent web hits before high confidence.
  research_dual_hit: true
  # Deep-dive / research-role turns get a higher tool-round budget (agent_loop).
  # Same query / same URL still stop. This is a fuse, not a reading diet.
  research_max_rounds: 32
  research_max_searches: 8
  research_max_pages: 16
  # Source / sim assess: workspace crawls burn rounds on list+read. Chat
  # and weather stay at max_rounds (8). Larger num_ctx does not raise this.
  inspect_max_rounds: 16
  # Research mode finish gate: need this many ok web sources (agent_loop).
  research_min_sources: 2
  # Both of these shrink the tool schema array, and both are off because
  # shrinking it costs more than it saves. The array is rendered near the front
  # of the prompt, so changing its shape between turns changes the prefix and
  # forfeits the prefix cache: measured on a 12 GB card, a 6-tool subset that
  # varied per turn prefilled ~9,700 tokens in 17s every turn, while the
  # constant 34-tool surface prefilled 19,455 tokens once and then cost 3.2s.
  # See scripts/measure_tool_surface_prefill.py.
  #
  # Turn either on only for a model that genuinely cannot choose among the full
  # set. Neither affects Allow, and neither can hide a send the turn asked for.
  research_tool_subset: false
  skill_tool_subset: false
  # Same-round independent READ tools (weather+inbox, search+scrape with URLs
  # already in the call) run together. Writes and Allow-gated calls stay serial.
  read_fanout: true
  # Mid-turn: escalate fast → research once if expected tools never fire.
  mid_turn_escalate: true
  escalate_after_rounds: 2
  # Folding the oldest turns into a one-paragraph summary costs an extra model
  # round mid-turn, so it is worth knowing when it fires. It is a last resort,
  # not a routine step: it only runs when the token budget cannot hold the
  # history, and at num_ctx 65536 the budget is ~60,000 tokens after the persona,
  # the telegraph policy and the skinny schemas — well over 150 turns.
  #
  # It used to run every few turns, which is what made it look like a design
  # flaw. That was the window, not this: at 16384 the budget left for history was
  # a few thousand tokens, so almost every turn dropped something and paid for a
  # summary. Speak, slash and research turns still skip it entirely.
  summarize_max_ms: 8000
  summarize_skip_slash: true
  # A backstop on message count, not the real limit — the token budget above is.
  # 24 was the binding constraint and cost roughly twelve turns of memory for no
  # reason: a session hit the cap long before it filled the window, and dropping
  # from the front of the prompt is the one edit that invalidates the whole
  # prefix cache. 120 is ~60 turns, which the budget can genuinely hold, and it
  # still bounds the worst case rather than growing without limit.
  #
  # This is also the size of the in-process working set: SessionMemory.from_config
  # reads it, so there is one number rather than two bounding the same history.
  # There used to be two. SessionMemory defaulted to 40 and won, which meant the
  # oldest turns were deleted there — with no summary, no fold and no telemetry —
  # while the fold-instead-of-forget path below could never reach them.
  history_max_messages: 120
  # Always keep this many recent prompt-visible messages, even when the
  # system prefix has already spent the token budget. 6 = prior 2 turns
  # plus the current user line. Conversation mode used to keep only the
  # newest line, so follow-ups forgot the last sentence.
  history_min_recent: 6
  # Hold ASSISTANT_DELTA until tool rounds settle (H5/R13 retract storms).
  # Schemas still ride every turn (chat_fast_path off). Hold and the
  # "call a tool first" hint only apply when this turn actually expects a
  # tool — otherwise chitchat streams while the prefix cache stays intact.
  stream_answer_after_tools: true
  # Fat scrape/doc/research bodies: cache full text, inject summary card.
  tool_summary_inject: true
  # Conversation: run weather/SMS preflight on provisional STT before end-point.
  voice_speculate_preflight: true

workspace:
  # Every path Arelis may read or write. Nothing outside these roots is
  # reachable, including via symlink or "..", because paths are fully resolved
  # before the containment check.
  #
  # A relative entry, "." included, resolves against the workspace root, not
  # against the install directory. That distinction is the difference between a
  # folder the user owns and the program's own files: this value used to resolve
  # to the directory holding the package, so on an installed copy the sandbox a
  # language model may create, edit and delete within was Arelis itself. From a
  # checkout both anchors are the repository, which is why it read as correct for
  # a year. See arelis.paths.default_workspace_root for why it is a named
  # subfolder of Documents rather than Documents itself.
  #
  # Flat path strings still work (name = directory basename). Prefer the named
  # form when you have more than one project; address files as name:relative/path.
  # Override live roots in config.local.yaml (Settings → Roots) so this shipped
  # default stays a single-root fresh install.
  # read_only=true rejects write/edit/create under that root.
  roots:
    - "."
    # Extra projects are opt-in (Settings → Roots, or the workspace dock).
    # Do not list sibling folders here. Example of a second root, local only:
    # - name: notes
    #   path: "C:/Users/you/Documents/notes"
    #   read_only: false

tools:
  web:
    enabled: true
    user_agent: "ArelisResearchBot/0.1 (+local; personal assistant)"
    timeout_s: 30
  scrape:
    enabled: true
    max_chars: 120000
    # When the main URL is a JS shell, retry AMP/print twins found in the HTML.
    follow_siblings: true
  search:
    # How she finds a page in the first place. Without this she can only reach
    # URLs she already knows, which is why anything current used to end in a
    # guessed address and an empty page.
    enabled: true
    # Silent lookup, no API key, no container, not a Settings picker.
    # Order is fixed in search.py: DuckDuckGo HTML, DuckDuckGo Lite, then
    # Wikipedia (Wikipedia is skipped when recency is day or week).
    max_results: 10
    timeout_s: 20
  research:
    # Deterministic multi-source disposer (search → scrape → markdown artifact).
    # Attended turns only. Prefer for deep dives / research role.
    enabled: true
    max_sources: 8
    max_chars_per_source: 4000
    output_dir: "outputs/research"
  email:
    # Transport only. Your address and app password live in data/secrets.yaml,
    # which is gitignored -- see data/secrets.example.yaml. Without that file
    # neither mail tool is registered at all.
    enabled: true
    from_name: "Arelis"
    smtp_host: "smtp.gmail.com"
    smtp_port: 587
    imap_host: "imap.gmail.com"
    imap_port: 993
    timeout_s: 30
    # Caps on how much mail can enter one turn's context. Newest first.
    max_messages: 20
    max_body_chars: 4000
  sms:
    # Texts leave through your own Android phone (Arelis companion radio, or
    # SMSGate as a leftover). They arrive from your number; replies come back
    # to the phone. Credentials live in data/secrets.yaml; without a pair or
    # an SMSGate block, send_sms is not registered at all. Independent of
    # email. Same confirm gate as send_email.
    #
    # Named people live in data/contacts.yaml (see data/contacts.example.yaml).
    enabled: true
    # A guard on how much the model can put on somebody's phone in one message,
    # not a protocol limit: the handset splits a long text into segments and the
    # recipient sees one message.
    max_body_chars: 1600
    timeout_s: 30
    inbound:
      # Primary: Android Arelis companion POSTs Google Messages
      # notifications (including RCS) to the LAN ingest server. Ingest stays up
      # with the desktop UI, while hidden in the tray, or via `arelis --core`.
      # Token: sms.ingest_token in data/secrets.yaml. Pair from Settings → Notify.
      enabled: true
      # How an inbound text announces itself is not configured here: it is the
      # per-channel mode in Settings → Notify → SMS (glass pill, optionally with
      # a voice cue when idle). Keys here would be read by nothing.
      ingest:
        enabled: true
        host: "0.0.0.0"
        port: 8765
      # Optional SMS/MMS fallback via SMSGate Local Server GET /inbox.
      # Does not see RCS — companion is required for Google Messages chats.
      fallback_smsgate: true
      poll_interval_s: 4
    auto_reply:
      # Phase 3. Off by default. When enabled, only allowlisted contact aliases
      # can get a draft reply, and every draft still uses the send_sms confirm
      # card — never a silent send.
      enabled: false
      contacts: []          # e.g. [wife, alex]
      rules: []             # [{match: "on my way", reply: "Drive safe."}]
      default_reply: ""     # used only when no rule matches; empty = no draft
  schedule:
    # Saved prompts that run on their own and email the answer. Needs email
    # configured, since delivery is the entire point.
    enabled: true
  tasks:
    # Local to-do list in memory.db (list/add/done/reopen/remove). Writes need
    # Allow. Open tasks appear in the morning briefing. Needs archive present.
    enabled: true
  goals:
    # Durable goals/commitments in memory.db (beyond chores). Writes need Allow.
    # Active goals appear in the morning briefing. Same archive gate as tasks.
    enabled: true
  rooms:
    # Named places to work on one thing, in data/rooms.yaml. Each keeps its own
    # conversation thread and points at one project. Creating or changing a
    # room needs Allow; entering one is a command, never a tool call.
    enabled: true
  browser:
    # Drive Arelis' own Chrome (data/browser-profile), not daily Chrome.
    # Install: pip install -e ".[browser]" && playwright install chromium firefox
    # See docs/browser-control.md. Never enters passwords/OTP. Never taskkills
    # chrome.exe — relaunch only stops her profile. If 9222 is already someone
    # else's Chrome, she opens her window on 9333+ instead of attaching.
    enabled: true
    cdp_url: "http://127.0.0.1:9222"
    max_snapshot_chars: 6000
    max_read_chars: 3500
    aliases:
      youtube: "https://www.youtube.com"
      gmail: "https://mail.google.com"
      github: "https://github.com"
      calendar: "https://calendar.google.com"
      maps: "https://www.google.com/maps"
  calendar:
    # Google Calendar API + Microsoft Graph (explicit OAuth exception).
    # Credentials in data/secrets.yaml → calendar.google / calendar.outlook.
    # Auth once: arelis --auth-calendar google|outlook
    # Writes always open a confirm card (never silent; never batch with allows).
    enabled: true
    # Sync this many days back/forward into the local cache on agenda sync/list.
    sync_past_days: 7
    sync_future_days: 60
    # Default calendar id per provider. Empty falls through to the id in
    # data/secrets.yaml, which is "primary" for Google and the account default
    # for Outlook — the right answer for almost everyone. Set one of these only
    # to reach a secondary or shared calendar the authorised account can see.
    google_calendar_id: ""
    outlook_calendar_id: ""
    # Pull Google's subscribed holiday calendars (en.usa#holiday@… and siblings)
    # in addition to primary. They are a separate calendarList entry, not events
    # on the primary calendar.
    include_holidays: true
  briefing:
    # Fixed morning digest (weather, unread mail, open loops, open tasks,
    # active goals, recent chats, calendar cache and/or local ICS), emailed on a
    # schedule via schedule(action='create_briefing'). That job builds the digest
    # in jobs/runner.py without a model, so this section is about the emailed
    # briefing only.
    #
    # 2026-08-14 removed the on-demand briefing tool. Asked for at chat time the
    # digest is assembled from agenda, inbox and tasks instead — one tool that
    # stitched five together was a tool the model had to be told to prefer, and
    # in 484 real turns it was never once called. This key still registers the
    # agenda tool, because the emailed digest is built from the calendar.
    enabled: true
    mail_limit: 10
    fact_limit: 8
    task_limit: 12
    goal_limit: 8
    session_limit: 5
    # Measured watchers v1: the deterministic ## Attention section of the emailed
    # briefing, and the "attention N" count in the world-state prompt line. The
    # attention tool that also read this was removed on 2026-08-14 — a read-only
    # aggregate of tasks, goals and agenda that the model never chose, and whose
    # own owner could not say what it was for. "What needs my attention" now
    # reads those three directly. No background poller, no silent send.
    attention:
      enabled: true
      limit: 12
      due_soon_days: 2
      soon_hours: 24
      stale_task_days: 7
      overdue_grace_days: 0
      # Config-only richer watchers (no second scheduler). Empty by default.
      #
      # inbox_rules read mail from wherever it has already been fetched, never
      # by opening a connection of their own. The emailed briefing has the full
      # unread list to hand, so rules there are exact. The live "attention N" in
      # her prompt line uses the last headers the notification poller collected,
      # which means it needs ui.notifications email polling on, and it lags by
      # up to one poll. file_rules and task/goal rules apply to both, always.
      # inbox_rules:
      #   - id: bills
      #     sender_contains: "billing@"
      #     subject_contains: ""
      # file_rules:
      #   - id: tax_packet
      #     path: "data/drops/taxes.pdf"
      #     missing: true
      #     # older_than_days: 14
      inbox_rules: []
      file_rules: []
    # ICS fallback when APIs are not configured (gitignored). See
    # data/calendar.example.ics. Prefer Google/Outlook sync when secrets exist.
    # Optional: set calendar.ics_url in data/secrets.yaml and call
    # agenda(action=sync, provider=ics) to refresh this file (Allow required).
    calendar_path: "data/calendar.ics"
  analyze:
    enabled: true
  # Run a project .py under workspace roots. Attended only. Allow
  # (confirm_run). Optional python: absolute interpreter; else <root>/.venv
  # then Arelis's own Python.
  run_script:
    enabled: true
    # python: "C:/path/to/lab/.venv/Scripts/python.exe"
  # Symbolic algebra (SymPy). Read, no Allow; unattended jobs may call it.
  cas:
    enabled: true
  # Pint conversions + a tiny cited constants table. Read, no Allow.
  units:
    enabled: true
  # arXiv + JPL Horizons (no key). NASA APOD / ADS after a free pasted key.
  # Read, no Allow. Jobs may call it. DEMO_KEY is refused.
  catalog:
    enabled: true
  # Matplotlib charts from a table or a short number list. Writes PNG under
  # outputs/plots/. Always Allow (confirm_writes). Off for unattended jobs.
  plot:
    enabled: true
  # PDF, Word, Excel, CSV, markdown, text under outputs/documents/. Allow
  # (confirm_writes). Off for unattended jobs.
  document:
    enabled: true
  # System clipboard plain-text read. Always Allow (may hold secrets). Off for
  # unattended jobs. No write/set clipboard in this pass.
  clipboard:
    enabled: true
    max_chars: 8000
  # Local Tesseract OCR (CPU). Requires `tesseract` on PATH. action=screen
  # grabs the primary display. Always Allow (confirm_vision). Not VL / not GPU.
  ocr:
    enabled: true
    max_chars: 12000
    output_dir: "outputs/images"
  # Local PDF text extract (pypdf). Paths stay under workspace roots; optional
  # page_start/page_end. No cloud OCR / no Google Drive. Evidence kind: doc.
  doc_extract:
    enabled: true
    max_chars: 20000
  image:
    enabled: true
    comfy_url: "http://127.0.0.1:8188"
    output_dir: "outputs/images"
    # Image generation runs on ComfyUI, which is a separate application and a
    # large download. Nothing here points anywhere by default: on a machine that
    # does not have it, the feature simply reports itself unavailable rather than
    # trying to launch a program that is not there.
    #
    # When true, a missing ComfyUI server is started for you (needs launch_cwd).
    auto_start: false
    # Folder that contains ComfyUI's main.py or a Windows portable root
    # (run_amd_gpu.bat / python_embeded). Required for auto-start.
    launch_cwd: ""
    # Empty = silent python + main.py (venv_directml when run_directml.bat
    # exists beside launch_cwd; else python_embeded). Do not use python_embeded
    # with --directml on AMD — that AV-crashes in torch.cuda.is_available().
    launch_command: ""
    startup_timeout_s: 180
  # Resize, crop and adjust an image that already exists (Pillow, in-process).
  # No model and no GPU: these have exactly right answers. Always writes a new
  # file into outputs/images/ and never modifies the source.
  image_edit:
    enabled: true
  # See one image (VL). Attended turns only; unload chat → VL → rewarm fast.
  vision:
    enabled: true
    # model defaults to models.vision; num_ctx defaults to ollama.vision_num_ctx
    # Long edge of what is actually sent. Two caps, because two windows:
    # the 3B fallback still has 4096 tokens (a 1440p screenshot is ~4,150 and
    # Ollama rejects it), so max_edge stays 1024 there. The chat model that
    # sees images is already at the chat window (~65k); chat_max_edge is 2048
    # so a phone photo of a screen still has readable chrome. Measured on
    # qwen2.5vl:3b: 1024px ~1,100 tokens, 1600px ~1,849 — both answer.
    max_edge: 1024
    chat_max_edge: 2048

voice:
  # Master switch. Each direction below has its own toggle under it, so the mic
  # can work with playback off, or she can speak without ever listening.
  enabled: true
  # Substring of the input device name, as Windows reports it, e.g. "Logitech".
  # Empty follows the system default input.
  input_device: ""
  # Substring of the output device name. Empty follows the system default.
  output_device: ""
  # Playback level for spoken replies (0.0–1.0). Persists via config.local.yaml.
  output_volume: 1.0
  # Recordings are deleted once transcribed. Set true to keep them under
  # outputs/voice/ when diagnosing a capture problem.
  keep_recordings: false
  # Write conversation decisions to logs/voice.log always (wake, barge-in,
  # Smart Turn, dropped utterances, live STT). voice.debug adds every VAD
  # tick on top of that. Off for debug means the firehose is off, not that
  # the file is empty.
  debug: false

  # Live onset / end-point detector for conversation and dictate.
  # silero = neural speech probability (default). energy = RMS floor fallback.
  # Missing ONNX/deps fall back to energy automatically.
  vad:
    backend: silero   # silero | energy
    threshold: 0.5
    # End only when EMA drops below this (hysteresis vs threshold) so brief
    # mid-phrase dips and unstressed last syllables stay voiced.
    end_threshold: 0.22
    onset_ms: 160
    # Empty uses models/silero/silero_vad.onnx
    model_path: ""
    allow_download: true

  # Idle wake requires the compound phrase "Hey Arelis" (not a bare name).
  # A match enters conversation. Slightly stricter than conversation so room
  # noise does not false-trigger; lower speech_level if wake feels deaf.
  # Failed near-misses show a short status with what Whisper heard.
  # max_utterance_s caps stuck-VAD dumps so Whisper is not fed multi-minute clips.
  # engine: whisper (legacy STT+regex) | openwakeword (dedicated ONNX; needs
  # models/wake/hey_arelis.onnx — see models/wake/README.md). Defaults to
  # openwakeword when that file exists, else whisper.
  wake:
    enabled: true
    engine: auto   # auto | openwakeword | whisper
    threshold: 0.5
    cooldown_ms: 1500
    model_path: ""
    silence_ms: 900
    speech_level: 0.03
    max_utterance_s: 8

  stt:
    enabled: true
    # sherpa (default ear) | faster-whisper (fallback if Sherpa or its
    # model files are missing). Conversation uses the Kroko 2025 Zipformer
    # pack when present (mixed-case, punctuation), else the 2023 LibriSpeech
    # pack. Wake still uses Whisper / openWakeWord.
    backend: sherpa
    model_dir: "models/sherpa"
    allow_download: true
    # tiny | base | small | medium | large-v3. Used only by the Whisper
    # fallback. base is the accuracy/latency knee on CPU.
    model_size: "base"
    device: "cpu"
    # int8 on CPU is about three times faster than float32 here for a
    # negligible accuracy cost, and the GPU is reserved for the chat models.
    compute_type: "int8"
    language: "en"      # "" to auto-detect, at the cost of a beat on short clips
    beam_size: 1
    # Post-hoc Silero inside faster-whisper. Off while live Silero already
    # end-points the clip — a second trim ate last words ("hobbies" → "hub").
    vad_filter: false
    # Words Whisper has no reason to expect. Keep this SHORT — a long jargon
    # list is often echoed back as the whole transcript on noisy clips.
    # UI/CLI also append active project names via compose_stt_initial_prompt.
    initial_prompt: "Hey Arelis."
    sample_rate: 16000  # what Whisper expects; changing this only costs quality

  tts:
    enabled: true
    # auto = Kokoro on CPU when espeak G2P + weights are present (or downloadable),
    # else Piper. Conversation half-duplex is unchanged. kokoro | piper pin one.
    backend: "auto"
    # Kokoro-82M (CPU ONNX). First launch may download ~300MB into models/kokoro/.
    kokoro_model: "models/kokoro/kokoro-v1.0.onnx"
    kokoro_voices: "models/kokoro/voices-v1.0.bin"
    kokoro_voice: "af_heart"   # American female; bf_emma for British
    speed: 1.0                 # Kokoro tempo; 1.0 is the voice's own pace
    allow_download: true
    # Piper fallback. Both the .onnx and sibling .onnx.json must be present.
    voice_model: "models/piper/en_GB-jenny_dioco-medium.onnx"
    # Full path to piper.exe, if it is not on PATH.
    piper_exe: ""
    # 0 means speak the whole answer. Length is handled by being able to
    # interrupt her, not by truncation; this is a runaway guard only.
    max_chars: 0
    # Piper-only pace. Stretches phoneme durations, not pitch. Jenny reads
    # slowly, so the fallback default is a little under 1.0.
    length_scale: 0.85

  conversation:
    # Hands-free mode. With Smart Turn loaded these are a short pause after
    # which the ONNX decides complete vs still-thinking. Without the model
    # the controller floors them to 900 / 550 so last words are not chopped.
    silence_ms: 280
    short_silence_ms: 280
    short_utterance_ms: 2800
    # Level counted as speech, as a fraction of full scale. The floor is also
    # measured from the room at the start of each listen and the higher of the
    # two wins, so this is a lower bound rather than the whole test.
    # (energy backend only; Silero uses voice.vad.threshold)
    speech_level: 0.015
    max_utterance_s: 60
    # Talking over her cuts her off. Turn this off if you use speakers rather
    # than a headset, where her own voice can trip the microphone.
    barge_in: true
    # Headset default: the interrupt clip is the next question. Speakers:
    # false keeps the mixed clip as control-only (stop / allow / deny).
    barge_in_as_turn: true
    # Semantic end-of-turn after the short Silero pause. First launch may
    # download ~8 MB into models/smart_turn/. False disables it.
    smart_turn:
      enabled: true
      allow_download: true
      threshold: 0.5
      model_path: ""

location:
  # So you do not have to say which city you are in every time you ask about
  # the weather. Sources are merged field by field, highest precedence first,
  # so naming only a city still gets a timezone from the OS and, with the
  # network layer on, coordinates from the lookup.
  enabled: true
  # Standing profile + place live here (gitignored). Copy
  # data/profile.example.yaml to data/profile.yaml. Optional `user:` fields
  # (name, answer style, work, …) are injected every turn; `location:` wins
  # over automatic place sources below. Keep `user:` short — not a 50-field form.
  profile_path: "data/profile.yaml"
  # Timezone and country from the operating system. No network, no permission.
  use_system: true
  network:
    # Off deliberately, not merely by default: this asks a third party where
    # this machine is, and a local-first assistant should be told to do that
    # rather than assume it. Turn it on if you carry a laptop between cities
    # and want the answer to follow you.
    enabled: false
    # Any service returning JSON with city/region/postal/latitude/longitude
    # works; the common field spellings are all accepted.
    url: "https://ipapi.co/json/"
    timeout_s: 6
    # Cached under data/ and reused across restarts, so travelling costs one
    # request a day rather than one per launch.
    cache_hours: 24

# Always-on presence (core / tray — see docs/architecture.md).
presence:
  # Close the window → stay in the OS tray (ingest keeps running). Tray menu
  # has Quit Arelis for a full stop. Set false for classic close-exits behavior.
  close_to_tray: true
  # When true, if a core is already listening the UI will not bind :8765 again.
  # UI also auto-attaches when a core is detected (or ARELIS_ATTACH_CORE=1).
  use_external_core: false
  lock_path: "data/arelis-core.lock"
  ui_lock_path: "data/arelis-ui.lock"
  pending_confirms_path: "data/pending_confirms.json"
  # Core process hosts its own tray (Open Arelis / Quit) when --core runs.
  core_tray: true
  # Core↔UI live event bridge (JSON lines). Loopback only — never 0.0.0.0.
  # Keep 8765 for SMS ingest; IPC defaults to 8766.
  ipc_enabled: true
  ipc_host: "127.0.0.1"
  ipc_port: 8766

ui:
  # Room look. View → themes. sodium is the shipped lamp — the default face.
  # filament is a test desk for a row of monitors; three is the intended layout.
  theme: sodium
  # Filament desk span: 1 / 2 / 3 desks from the OS primary. Starts on one;
  # press 3 when the row is there. Not Windows monitor numbers.
  filament_span: 1
  # Extra zoom on top of the OS display scale (100% / 125% / 150% / 200%).
  # 1.0 follows Windows. Do not set this to "fix" 4K — the OS already did.
  scale: 1.0
  window_title: "Arelis"
  default_width: 1440
  default_height: 900
  # First run and "reset layout": conversation glass only. Instruments open from
  # the View menu, or when content arrives (thinking on tools/traces, workspace
  # on writes/images). After first run, data/ui_layout.ini wins.
  thinking_open: false
  workspace_open: false
  camera_open: false
  # Away rest (collapse unused panels) lives in ui_layout.ini via Settings →
  # Window, off by default. Not a shipped-on timer.
  notifications:
    channels:
      sms: voice
      calendar: visual
      email: visual
      job: visual
      task: visual
      allow: visual
    calendar_leads_min: [15, 5, 0]
    poll_s: 30
    mail_poll_s: 90

persona_file: "persona/arelis.md"
